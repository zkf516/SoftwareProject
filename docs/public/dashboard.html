<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>患者信息</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="dashboard">
        <div class="sidebar">
            <div class="patient-info">
                <h2>---</h2>
                <p>身份证号：</p>
                <p>住院号：</p>
                <p>CARDNO：</p>
                <p>性别：</p>
                <p>年龄：</p>
                <p>身高：</p>
                <p>是否住院：</p>
            </div>
            <nav>
                <button class="dashborad-btn" onclick="dashboard()">基本信息</button>
                <button class="dashborad-btn" onclick="records()">病历数据</button>
                <button class="dashborad-btn" onclick="chat()">医疗建议</button>
                <button class="dashborad-btn" onclick="nextpage()">下一页</button>
            </nav>
        </div>
        <div class="main-content">
            <div class="info-card">
                <h3>患者特征：孕妇</h3>
                <div class="vital-signs">
                    <div class="data-group">
                        <p class="infomation">血压</p>
                        <p class="data"></p>
                    </div>
                    <div class="data-group">
                        <p class="infomation">孕周</p>
                        <p class="data"></p>
                    </div>
                    <div class="data-group">
                        <p class="infomation">孕次</p>
                        <p class="data"></p>
                    </div>
                    <div class="data-group">
                        <p class="infomation">产次</p>
                        <p class="data"></p>
                    </div>

                    <div class="data-group">
                        <p class="infomation">入院诊断</p>
                        <p class="data"></p>
                    </div>
                    <div class="data-group">
                        <p class="infomation">出院诊断</p>
                        <p class="data"></p>
                    </div>
                    <div class="data-group">
                        <p class="infomation">孕前体重</p>
                        <p class="data"></p>
                    </div>
                    <div class="data-group">
                        <p class="infomation">入院体重</p>
                        <p class="data"></p>
                    </div>

                    <div class="data-group">
                        <p class="infomation">婴儿性别</p>
                        <p class="data"></p>
                    </div>
                    <div class="data-group">
                        <p class="infomation">胎儿体重</p>
                        <p class="data"></p>
                    </div>
                    <div class="data-group">
                        <p class="infomation">胎儿身长</p>
                        <p class="data"></p>
                    </div>
                    <div class="data-group">
                        <p class="infomation">分娩方式</p>
                        <p class="data"></p>
                    </div>

                </div>
            </div>
            <div class="info-card">
                <h3>患者体征</h3>
                <div class="data">
                    <p style="white-space: pre-line"></p>
                </div>
            </div>
        </div>
    </div>
</body>
<script src=""></script>
</html>
