<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>医疗系统登录 - 现代简约风格</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #2A7CC7;
            --secondary: #6EC0E8;
            --accent: #42B883;
            --text: #333333;
            --light-bg: #f8fdff;
            --card-bg: rgba(255, 255, 255, 0.95);
            --doctor-color: #4A77B5;
            --patient-color: #42B883;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #e6f7ff, #ffffff);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 20px;
        }

        .login-card {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(42, 124, 199, 0.1);
        }

        .login-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .login-header h2 {
            color: var(--primary);
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .login-header p {
            color: #666;
            font-size: 16px;
        }

        .identity-selector {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
            border-radius: 12px;
            background: #f0f8ff;
            padding: 4px;
            position: relative;
        }

        .identity-option {
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            flex: 1;
            z-index: 2;
            transition: all 0.3s ease;
            font-weight: 500;
            color: #666;
        }

        .identity-slider {
            position: absolute;
            height: calc(100% - 8px);
            width: calc(50% - 4px);
            background: var(--primary);
            border-radius: 10px;
            top: 4px;
            left: 4px;
            z-index: 1;
            transition: all 0.3s ease;
        }

        .identity-option.active {
            color: white;
        }

        .input-group {
            margin: 1.5rem 0;
            position: relative;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
            z-index: 2;
        }

        .input-group input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border: 1px solid #ddd;
            border-radius: 10px;
            color: var(--text);
            font-size: 16px;
            transition: all 0.3s ease;
            background: var(--light-bg);
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(42, 124, 199, 0.2);
        }

        .login-btn {
            background: var(--primary);
            color: white;
            padding: 15px;
            border: none;
            border-radius: 10px;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
            font-weight: 600;
            margin-top: 10px;
        }

        .login-btn:hover {
            background: #1e6cb3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(42, 124, 199, 0.3);
        }

        .register-section {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #eee;
        }

        .register-text {
            color: #666;
            margin-bottom: 10px;
        }

        .register-btn {
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .register-btn:hover {
            background: rgba(42, 124, 199, 0.1);
        }

        @media (max-width: 500px) {
            .login-card {
                padding: 1.5rem;
            }

            .identity-option {
                padding: 8px 15px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h2>医疗系统登录</h2>
                <p>请选择您的身份并登录系统</p>
            </div>

            <div class="identity-selector">
                <div class="identity-slider"></div>
                <div class="identity-option active" data-identity="patient">病人登录</div>
                <div class="identity-option" data-identity="doctor">医生登录</div>
            </div>

            <form id="patient-form" class="login-form">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="patient-name" placeholder="请输入姓名" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-id-card"></i>
                    <input type="text" id="patient-number" placeholder="请输入住院号/卡号" required>
                </div>
                <button type="submit" class="login-btn">登 录</button>
            </form>

            <form id="doctor-form" class="login-form" style="display: none;">
                <div class="input-group">
                    <i class="fas fa-user-md"></i>
                    <input type="text" id="doctor-name" placeholder="请输入姓名" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-phone"></i>
                    <input type="text" id="doctor-phone" placeholder="请输入手机号" required>
                </div>
                <button type="submit" class="login-btn">登 录</button>
            </form>

            <div class="register-section">
                <p class="register-text">还没有账号？</p>
                <button class="register-btn">立即注册</button>
            </div>
        </div>
    </div>

    <script>
        document.querySelectorAll('.identity-option').forEach(option => {
            option.addEventListener('click', function () {
                const identity = this.getAttribute('data-identity');

                document.querySelectorAll('.identity-option').forEach(opt => {
                    opt.classList.remove('active');
                });
                this.classList.add('active');

                const slider = document.querySelector('.identity-slider');
                slider.style.left = identity === 'patient' ? '4px' : 'calc(50% + 4px)';

                document.getElementById('patient-form').style.display = identity === 'patient' ? 'block' : 'none';
                document.getElementById('doctor-form').style.display = identity === 'doctor' ? 'block' : 'none';
            });
        });

        document.getElementById('patient-form').addEventListener('submit', function (e) {
            e.preventDefault();
            const name = document.getElementById('patient-name').value;
            const number = document.getElementById('patient-number').value;
            alert(`病人登录: 姓名-${name}, 住院号/卡号-${number}`);
        });

        document.getElementById('doctor-form').addEventListener('submit', function (e) {
            e.preventDefault();
            const name = document.getElementById('doctor-name').value;
            const phone = document.getElementById('doctor-phone').value;
            alert(`医生登录: 姓名-${name}, 手机号-${phone}`);
        });

        document.querySelector('.register-btn').addEventListener('click', function () {
            alert('跳转到注册页面');
        });
    </script>
</body>

</html>
