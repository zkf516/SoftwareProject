<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>医疗系统登录 - 深色专业风格</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #1E88E5;
            --secondary: #1565C0;
            --accent: #00E5FF;
            --text: #FFFFFF;
            --dark-bg: #121C2B;
            --card-bg: rgba(30, 40, 60, 0.8);
            --input-bg: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0D1726, #1E2A3B);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* 新增粒子背景样式 */
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
        }

        .background-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(30, 136, 229, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 229, 255, 0.1) 0%, transparent 40%);
            z-index: -1;
        }

        .login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 20px;
            z-index: 1;
        }

        .login-card {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 229, 255, 0.1) 0%, transparent 70%);
            transform: rotate(0deg);
            z-index: -1;
        }

        .login-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .login-header h2 {
            color: var(--accent);
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
        }

        .login-header p {
            color: #CCCCCC;
            font-size: 16px;
        }

        .identity-selector {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.2);
            padding: 4px;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .identity-option {
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            flex: 1;
            z-index: 2;
            transition: all 0.3s ease;
            font-weight: 500;
            color: #CCCCCC;
        }

        .identity-slider {
            position: absolute;
            height: calc(100% - 8px);
            width: calc(50% - 4px);
            background: var(--primary);
            border-radius: 10px;
            top: 4px;
            left: 4px;
            z-index: 1;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(30, 136, 229, 0.5);
        }

        .identity-option.active {
            color: white;
        }

        .input-group {
            margin: 1.5rem 0;
            position: relative;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent);
            z-index: 2;
        }

        .input-group input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: var(--text);
            font-size: 16px;
            transition: all 0.3s ease;
            background: var(--input-bg);
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.2);
        }

        .input-group input::placeholder {
            color: #AAAAAA;
        }

        .login-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 15px;
            border: none;
            border-radius: 10px;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
            font-weight: 600;
            margin-top: 10px;
            position: relative;
            overflow: hidden;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: all 0.5s;
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(30, 136, 229, 0.4);
        }

        .register-section {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .register-text {
            color: #CCCCCC;
            margin-bottom: 10px;
        }

        .register-btn {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
            position: relative;
            overflow: hidden;
        }

        .register-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 100%;
            background: rgba(0, 229, 255, 0.1);
            transition: all 0.3s;
            z-index: -1;
        }

        .register-btn:hover::before {
            width: 100%;
        }

        .register-btn:hover {
            background: rgba(0, 229, 255, 0.1);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.3);
        }

        @media (max-width: 500px) {
            .login-card {
                padding: 1.5rem;
            }

            .identity-option {
                padding: 8px 15px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <!-- 粒子背景容器 -->
    <div id="particles-js"></div>
    <div class="background-overlay"></div>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h2>医疗系统登录</h2>
                <p>请选择您的身份并登录系统</p>
            </div>

            <div class="identity-selector">
                <div class="identity-slider"></div>
                <div class="identity-option active" data-identity="patient">病人登录</div>
                <div class="identity-option" data-identity="doctor">医生登录</div>
            </div>

            <form id="patient-form" class="login-form">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="patient-name" placeholder="请输入姓名" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-id-card"></i>
                    <input type="text" id="patient-number" placeholder="请输入住院号/卡号" required>
                </div>
                <button type="submit" class="login-btn">登 录</button>
            </form>

            <form id="doctor-form" class="login-form" style="display: none;">
                <div class="input-group">
                    <i class="fas fa-user-md"></i>
                    <input type="text" id="doctor-name" placeholder="请输入姓名" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-phone"></i>
                    <input type="text" id="doctor-phone" placeholder="请输入手机号" required>
                </div>
                <button type="submit" class="login-btn">登 录</button>
            </form>

            <div class="register-section">
                <p class="register-text">还没有账号？</p>
                <button class="register-btn">立即注册</button>
            </div>
        </div>
    </div>

    <!-- 引入粒子效果库 -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        // 初始化粒子背景
        document.addEventListener('DOMContentLoaded', function () {
            particlesJS('particles-js', {
                particles: {
                    number: { value: 80, density: { enable: true, value_area: 800 } },
                    color: { value: "#ffffff" },
                    shape: { type: "circle" },
                    opacity: {
                        value: 0.2,
                        random: true,
                        anim: { enable: true, speed: 1, opacity_min: 0.1, sync: false }
                    },
                    size: {
                        value: 3,
                        random: true,
                        anim: { enable: true, speed: 2, size_min: 0.1, sync: false }
                    },
                    line_linked: {
                        enable: true,
                        distance: 150,
                        color: "#1E88E5",
                        opacity: 0.1,
                        width: 1
                    },
                    move: {
                        enable: true,
                        speed: 1,
                        direction: "none",
                        random: true,
                        straight: false,
                        out_mode: "out",
                        bounce: false,
                        attract: { enable: false, rotateX: 600, rotateY: 1200 }
                    }
                },
                interactivity: {
                    detect_on: "canvas",
                    events: {
                        onhover: { enable: true, mode: "grab" },
                        onclick: { enable: true, mode: "push" },
                        resize: true
                    },
                    modes: {
                        grab: { distance: 140, line_linked: { opacity: 0.5 } },
                        push: { particles_nb: 4 }
                    }
                },
                retina_detect: true
            });
        });

        document.querySelectorAll('.identity-option').forEach(option => {
            option.addEventListener('click', function () {
                const identity = this.getAttribute('data-identity');

                document.querySelectorAll('.identity-option').forEach(opt => {
                    opt.classList.remove('active');
                });
                this.classList.add('active');

                const slider = document.querySelector('.identity-slider');
                slider.style.left = identity === 'patient' ? '4px' : 'calc(50% + 4px)';

                document.getElementById('patient-form').style.display = identity === 'patient' ? 'block' : 'none';
                document.getElementById('doctor-form').style.display = identity === 'doctor' ? 'block' : 'none';
            });
        });

        document.getElementById('patient-form').addEventListener('submit', function (e) {
            e.preventDefault();
            const name = document.getElementById('patient-name').value;
            const number = document.getElementById('patient-number').value;
            alert(`病人登录: 姓名-${name}, 住院号/卡号-${number}`);
        });

        document.getElementById('doctor-form').addEventListener('submit', function (e) {
            e.preventDefault();
            const name = document.getElementById('doctor-name').value;
            const phone = document.getElementById('doctor-phone').value;
            alert(`医生登录: 姓名-${name}, 手机号-${phone}`);
        });

        document.querySelector('.register-btn').addEventListener('click', function () {
            alert('跳转到注册页面');
        });
    </script>
</body>

</html>
